name: Central
on:
  schedule:
    - cron: '0 6 * * *'  # daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not k1LoW/octocov-action here, deliberately: that action runs
      # octocov via actions/github-script's exec.exec(), and empirically
      # (verified by running the identical binary/config both ways in the
      # same job) that path does not reliably relay a job/step-level
      # GITHUB_TOKEN down to the spawned octocov process — central.push's
      # own git push (gh.PushUsingLocalGit) needs exactly that env var,
      # separately from OCTOCOV_GITHUB_TOKEN (which the action does relay
      # correctly, since it sets that one directly in its own YAML). A
      # plain step has no such indirection, so it works.
      - name: Install octocov
        run: |
          curl -sSL https://github.com/k1LoW/octocov/releases/download/v0.79.0/octocov_v0.79.0_linux_amd64.tar.gz -o /tmp/octocov.tar.gz
          tar -xzf /tmp/octocov.tar.gz -C /tmp octocov
          sudo install -m 755 /tmp/octocov /usr/local/bin/octocov
      - name: Run octocov (central mode)
        env:
          # Cross-repo read of tangle's artifact:// datastore.
          OCTOCOV_GITHUB_TOKEN: ${{ secrets.TANGLE_ARTIFACTS_TOKEN }}
          # central.push's own git push back to this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: octocov --config=.octocov.yml
