name: Central
on:
  schedule:
    - cron: '0 6 * * *'  # daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # octocov's own git push (gh.PushUsingLocalGit) sets its own
          # explicit Basic Auth on the push. Testing whether checkout's
          # default persisted credential (an Authorization extraheader in
          # local git config, using the default GITHUB_TOKEN) conflicts
          # with that explicit auth.
          persist-credentials: false
      - name: Install octocov
        run: |
          curl -sSL https://github.com/k1LoW/octocov/releases/download/v0.79.0/octocov_v0.79.0_linux_amd64.tar.gz -o /tmp/octocov.tar.gz
          tar -xzf /tmp/octocov.tar.gz -C /tmp octocov
          sudo install -m 755 /tmp/octocov /usr/local/bin/octocov
      - name: Run octocov (central mode)
        env:
          # Cross-repo read of tangle's artifact:// datastore.
          OCTOCOV_GITHUB_TOKEN: ${{ secrets.TANGLE_ARTIFACTS_TOKEN }}
          # central.push's own git push back to this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: octocov --config=.octocov.yml
