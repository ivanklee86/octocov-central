name: Central
on:
  schedule:
    - cron: '0 6 * * *'  # daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: k1LoW/octocov-action@v1
        with:
          config: .octocov.yml
          version: v0.79.0
          # Only for reading tangle's artifact:// datastore (a cross-repo
          # read) — octocov-action forwards this as OCTOCOV_GITHUB_TOKEN.
          github-token: ${{ secrets.TANGLE_ARTIFACTS_TOKEN }}
        env:
          # Separately, for octocov's own `central.push` back to *this*
          # repo: its git push (gh.PushUsingLocalGit) authenticates with
          # the plain GITHUB_TOKEN env var specifically — a different var
          # from OCTOCOV_GITHUB_TOKEN above — so the read-only,
          # tangle-scoped PAT never has to (and couldn't) push here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
